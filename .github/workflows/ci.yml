name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Python 3.9
            os: ubuntu-latest
            python: "3.9"
          - name: macOS / Python 3.13
            os: macos-latest
            python: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check runner dependencies
        run: command -v python3 bash sqlite3
      - name: Compile Python
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile *.py
      - name: Check shell syntax
        run: bash -n bridge.sh adapters/openclaw.sh
      - name: Run fixture suite
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v test_message.py test_http_server.py test_openclaw_adapter.py
      - name: Run synthetic replay
        run: PYTHONDONTWRITEBYTECODE=1 python3 runtime.py --replay --agent ci-agent
