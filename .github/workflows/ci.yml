name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Python 3.9
            os: ubuntu-latest
            python: "3.9"
          - name: macOS / Python 3.13
            os: macos-latest
            python: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check runner dependencies
        run: command -v python3 bash sqlite3
      - name: Compile Python
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile *.py
      - name: Check shell syntax
        run: bash -n bridge.sh adapters/openclaw.sh
      - name: Run fixture suite
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v test_message.py test_http_server.py test_openclaw_adapter.py
      - name: Run synthetic replay
        run: PYTHONDONTWRITEBYTECODE=1 python3 runtime.py --replay --agent ci-agent
